[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-sqlite-explorer"
dynamic = ["version"]
description = "A read-only MCP server that lets Claude (or any MCP client) safely explore a SQLite database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabe" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.22,<2"]
keywords = ["mcp", "model-context-protocol", "sqlite", "claude", "llm", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/TGabeCar/mcp-sqlite-explorer"
Issues = "https://github.com/TGabeCar/mcp-sqlite-explorer/issues"

[project.scripts]
mcp-sqlite-explorer = "mcp_sqlite_explorer.server:main"

[tool.hatch.version]
path = "src/mcp_sqlite_explorer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_sqlite_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
